<text x="142" y="291" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#10213D">Editar usuario</text>
<text x="142" y="341" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Cambiar datos, estado</text>
<text x="142" y="374" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">o relaciones permitidas</text>
<rect x="720" y="245" width="480" height="165" rx="20" fill="#FFF5DF" stroke="#C46A08" stroke-width="4" filter="url(#shadow)"/>
<text x="742" y="291" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#10213D">Advertencia previa</text>
<text x="742" y="341" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Explica efectos del estado</text>
<text x="742" y="374" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">y solicita confirmación</text>
