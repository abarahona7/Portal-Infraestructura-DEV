<text x="1402" y="291" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#10213D">Guardar en transacción</text>
<text x="1402" y="341" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Validar restricciones</text>
<text x="1402" y="374" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Aplicar el cambio completo</text>
<rect x="2020" y="245" width="440" height="165" rx="20" fill="#F1ECFF" stroke="#6D45C7" stroke-width="4" filter="url(#shadow)"/>
