<text x="2042" y="341" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Actor, fecha y origen</text>
<text x="2042" y="374" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Valores anterior y actual</text>
