<text x="152" y="661" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#10213D">ACTIVO</text>
<text x="152" y="711" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Puede mantener o recibir IP</text>
<text x="152" y="744" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Puede mantener equipos</text>
<text x="152" y="777" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Puede mantener anexo</text>
<text x="152" y="810" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Las asignaciones se sincronizan</text>
<rect x="970" y="615" width="620" height="330" rx="20" fill="#FFF5DF" stroke="#C46A08" stroke-width="4" filter="url(#shadow)"/>
<text x="992" y="661" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#10213D">LICENCIA MÉDICA</text>
<text x="992" y="711" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Libera solamente la IP</text>
<text x="992" y="744" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Conserva equipos asignados</text>
<text x="992" y="777" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Conserva anexo asignado</text>
<text x="992" y="810" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Registra la liberación en historial</text>
<rect x="1810" y="615" width="620" height="330" rx="20" fill="#FDECEE" stroke="#C9363E" stroke-width="4" filter="url(#shadow)"/>
<text x="1832" y="661" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#10213D">BAJA</text>
<text x="1832" y="711" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Libera la IP</text>
<text x="1832" y="744" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Desasigna equipos</text>
<text x="1832" y="777" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Libera el anexo</text>
<text x="1832" y="810" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Solicita validar devolución física</text>
<rect x="120" y="1185" width="390" height="175" rx="20" fill="#EAF2FF" stroke="#2563EB" stroke-width="4" filter="url(#shadow)"/>
<text x="142" y="1231" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#10213D">Abrir ficha</text>
<text x="142" y="1281" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">El usuario solicita</text>
<text x="142" y="1314" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">crear acta de entrega</text>
<rect x="680" y="1185" width="520" height="175" rx="20" fill="#FFF5DF" stroke="#C46A08" stroke-width="4" filter="url(#shadow)"/>
<text x="702" y="1231" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#10213D">Validar equipos</text>
<text x="702" y="1281" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">¿Existe al menos un equipo</text>
<text x="702" y="1314" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">actualmente asignado?</text>
<rect x="1390" y="1160" width="500" height="200" rx="20" fill="#FDECEE" stroke="#C9363E" stroke-width="4" filter="url(#shadow)"/>
<text x="1412" y="1206" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#10213D">No se puede emitir</text>
<text x="1412" y="1256" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Respuesta HTTP 409</text>
<text x="1412" y="1289" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Mensaje explica que el usuario</text>
<text x="1412" y="1322" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">no posee equipos asignados</text>
<rect x="2050" y="1160" width="410" height="200" rx="20" fill="#E6F7EE" stroke="#138A50" stroke-width="4" filter="url(#shadow)"/>
<text x="2072" y="1206" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#10213D">Generar PDF</text>
<text x="2072" y="1256" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Incluye datos y equipos</text>
<text x="2072" y="1289" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">Devuelve el acta</text>
<text x="2072" y="1322" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52647F">para revisión y entrega</text>
<rect x="820" y="950" width="960" height="95" rx="20" fill="#F1ECFF" stroke="#6D45C7" stroke-width="4" filter="url(#shadow)"/>
<text x="842" y="996" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#10213D">Historial relacionado</text>
<text x="842" y="1038" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#52647F">Todos los efectos quedan vinculados a la ficha del usuario.</text>
<text x="70" y="1545" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#52647F">La licencia médica libera solo la IP; la baja libera IP, equipos y anexo.</text>
